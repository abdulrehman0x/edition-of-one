services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./pdf_generator:/app/pdf_generator
    environment:
      - LLM_OFFLINE=${LLM_OFFLINE:-1}
    env_file:
      - path: .env
        required: false

